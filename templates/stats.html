<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>URL Stats</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <div class="container">
    <h1>All Links / Stats</h1>
    <table>
      <thead>
        <tr><th>Short</th><th>Original URL</th><th>Clicks</th><th>Created At</th><th>Expires At</th></tr>
      </thead>
      <tbody>
      {% for l in links %}
        <tr>
          <td><a href="{{ request.host_url }}{{ l.short_code }}">{{ l.short_code }}</a></td>
          <td><a href="{{ l.original_url }}" target="_blank">{{ l.original_url }}</a></td>
          <td>{{ l.clicks }}</td>
          <td>{{ l.created_at }}</td>
          <td>{{ l.expire_at if l.expire_at else 'Never' }}</td>
        </tr>
      {% else %}
        <tr><td colspan="5">No links yet</td></tr>
      {% endfor %}
      </tbody>
    </table>

    <p><a href="{{ url_for('index') }}">Back</a></p>
  </div>
</body>
</html>
